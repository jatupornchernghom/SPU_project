services:
  - type: web
    name: spu-skipq
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Render runs in UTC; daily queue / order numbers should reset at Thai midnight.
      - key: TZ
        value: Asia/Bangkok
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
